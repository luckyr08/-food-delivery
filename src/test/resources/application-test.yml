spring:
  datasource:
    # Separate schema so tests never touch dev data.
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/food_delivery_test}
    hikari:
      # Many cached test contexts (property overrides, @MockitoBean) each keep a pool; hold few idle connections
      # so they don't exhaust MySQL's max_connections (151). Pools still grow to 20 under concurrency tests.
      minimum-idle: 2
      idle-timeout: 10000
  flyway:
    # Tests reset the schema between classes; never enable this outside tests.
    clean-disabled: false

app:
  order:
    # Existing tests place many orders per customer and fire bursts; spike/limit tests override these.
    admission:
      acquire-timeout-ms: 10000
    rate-limit:
      capacity: 1000
      refill-per-minute: 1000
  payment:
    reconciler:
      # Tests call PaymentReconciler directly.
      enabled: false
  outbox:
    relay:
      # Tests drive the relay explicitly (OutboxRelay.drain()) for deterministic assertions.
      enabled: false
