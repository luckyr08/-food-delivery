spring:
  application:
    name: food-delivery

  datasource:
    # Values come from env vars; defaults match scripts/db-setup.sql for local dev.
    url: ${DB_URL:jdbc:mysql://localhost:3306/food_delivery}
    username: ${DB_USERNAME:food_app}
    password: ${DB_PASSWORD:food_app_pwd}
    hikari:
      maximum-pool-size: 20

  jpa:
    # Schema is owned by Flyway; Hibernate only checks entities match the tables.
    hibernate:
      ddl-auto: validate
    # No lazy loading outside transactions (e.g. during JSON rendering).
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # HMAC-SHA256 key, must be >= 32 bytes. Override via env var outside local dev.
    secret: ${JWT_SECRET:local-dev-secret-change-me-please-32bytes-min}
    expiration-minutes: 60
  order:
    delivery-fee: 40.00
    # Orders with a subtotal at or above this amount get free delivery.
    free-delivery-from: 500.00
  review:
    # Customers can review an order for this many days after delivery.
    window-days: 7

server:
  error:
    include-stacktrace: never
