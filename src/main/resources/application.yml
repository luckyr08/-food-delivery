spring:
  application:
    name: food-delivery

  datasource:
    # Values come from env vars; defaults match scripts/db-setup.sql for local dev.
    url: ${DB_URL:jdbc:mysql://localhost:3306/food_delivery}
    username: ${DB_USERNAME:food_app}
    password: ${DB_PASSWORD:food_app_pwd}
    hikari:
      maximum-pool-size: 20
      # Fail fast instead of queueing for 30 s (Hikari default) when the pool is exhausted.
      connection-timeout: 2000
      # Row-lock waits give up after 5 s (MySQL default 50 s) -> retried once, then 503 SERVICE_BUSY.
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = 5

  jpa:
    # Schema is owned by Flyway; Hibernate only checks entities match the tables.
    hibernate:
      ddl-auto: validate
    # No lazy loading outside transactions (e.g. during JSON rendering).
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # HMAC-SHA256 key, must be >= 32 bytes. Override via env var outside local dev.
    secret: ${JWT_SECRET:local-dev-secret-change-me-please-32bytes-min}
    expiration-minutes: 60
  order:
    delivery-fee: 40.00
    # Orders with a subtotal at or above this amount get free delivery.
    free-delivery-from: 500.00
    admission:
      # Concurrent placements per instance; keep below the DB pool size (20) to leave room for other work.
      max-concurrent: 16
      acquire-timeout-ms: 200
    rate-limit:
      capacity: 5
      refill-per-minute: 5
  review:
    # Customers can review an order for this many days after delivery.
    window-days: 7
  payment:
    # Orders stuck in PAYMENT_PENDING are checked with the gateway, then completed or cancelled.
    reservation-expiry-minutes: 15
    reconciler:
      enabled: true
      interval-ms: 60000
      min-age-seconds: 60
  outbox:
    relay:
      # Background relay that pushes outbox events to the search index.
      enabled: true
      poll-interval-ms: 1000
      batch-size: 100

server:
  error:
    include-stacktrace: never
